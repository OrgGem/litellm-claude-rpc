model_list:
  - model_name: claude-default
    litellm_params:
      model: claude_rpc/claude-default
      use_chat_completions_api: true
litellm_settings:
  callbacks:
    - proxy_handler.claude_rpc_responses_guard
  custom_provider_map:
    - provider: claude_rpc
      custom_handler: proxy_handler.claude_rpc_provider
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
router_settings:
  num_retries: 0
